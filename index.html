<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة إدارة الهاكاثونات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: race-lane admin shell — ink sidebar with lane stripes, calm workspace, active hackathon pinned in the top bar */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --surface-2:#E9EEEC; --line:#D3DCD8; --fg:#15201D; --muted:#56655F;
  --ink:#0D2724; --ink-2:#143531; --ink-fg:#DDEAE6; --ink-muted:#8EA9A2; --ink-line:#24453F;
  --accent:#0A7468; --accent-fg:#FFFFFF; --accent-soft:#D3ECE7; --signal:#C97A1F;
  --ok:#1C6E3F; --ok-bg:#DCF1E4; --warn:#8A5A00; --warn-bg:#FAEDCF; --bad:#A92E26; --bad-bg:#F8DFDB;
  --info:#285A9E; --info-bg:#DEE8F7; --neutral:#55625D; --neutral-bg:#E4EAE7; --purple:#623FA0; --purple-bg:#EBE3F6;
  --shadow:0 1px 2px rgba(13,39,36,.06),0 4px 16px rgba(13,39,36,.06);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1715; --surface:#16211E; --surface-2:#1D2A27; --line:#2B3B37; --fg:#E3ECE9; --muted:#9AAEA8;
  --ink:#0A1412; --ink-2:#10201D; --ink-fg:#D6E5E0; --ink-muted:#7F9B94; --ink-line:#1F3833;
  --accent:#3FB5A5; --accent-fg:#06201C; --accent-soft:#183B36; --signal:#E3A04B;
  --ok:#6FD39A; --ok-bg:#183626; --warn:#F0C062; --warn-bg:#3A2D10; --bad:#F2877E; --bad-bg:#3E1C19;
  --info:#8DB4EE; --info-bg:#1B2B44; --neutral:#A7B5B0; --neutral-bg:#253230; --purple:#B9A0EA; --purple-bg:#2C2342;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1715; --surface:#16211E; --surface-2:#1D2A27; --line:#2B3B37; --fg:#E3ECE9; --muted:#9AAEA8;
  --ink:#0A1412; --ink-2:#10201D; --ink-fg:#D6E5E0; --ink-muted:#7F9B94; --ink-line:#1F3833;
  --accent:#3FB5A5; --accent-fg:#06201C; --accent-soft:#183B36; --signal:#E3A04B;
  --ok:#6FD39A; --ok-bg:#183626; --warn:#F0C062; --warn-bg:#3A2D10; --bad:#F2877E; --bad-bg:#3E1C19;
  --info:#8DB4EE; --info-bg:#1B2B44; --neutral:#A7B5B0; --neutral-bg:#253230; --purple:#B9A0EA; --purple-bg:#2C2342;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:600}
h1{font-size:1.55rem} h2{font-size:1.12rem} h3{font-size:.98rem}
.num,.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
a{color:var(--accent)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--ink);color:var(--ink-fg);display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--ink-line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:600;white-space:nowrap}
.brand .mark{width:30px;height:30px;border-radius:7px;background:repeating-linear-gradient(90deg,var(--signal) 0 4px,transparent 4px 9px),var(--ink-2);border:1px solid var(--ink-line)}
.hk-pick{display:flex;align-items:center;gap:8px;background:var(--ink-2);border:1px solid var(--ink-line);border-radius:10px;padding:4px 6px 4px 10px;min-width:0}
.hk-pick .lane{width:6px;align-self:stretch;border-radius:3px}
.hk-pick label{font-size:.72rem;color:var(--ink-muted);letter-spacing:.02em}
.hk-pick select{background:transparent;border:0;color:var(--ink-fg);font-weight:600;max-width:320px;padding:2px}
.hk-pick select option{color:#15201D;background:#fff}
.top .grow{flex:1}
.top .search{display:flex;align-items:center;background:var(--ink-2);border:1px solid var(--ink-line);border-radius:9px;padding:0 10px;min-width:0}
.top .search input{background:transparent;border:0;color:var(--ink-fg);padding:7px 4px;width:200px;max-width:40vw}
.top .search input::placeholder{color:var(--ink-muted)}
.tbtn{background:var(--ink-2);border:1px solid var(--ink-line);color:var(--ink-fg);border-radius:9px;padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;position:relative}
.tbtn .dot{position:absolute;top:-5px;inset-inline-end:-5px;background:var(--signal);color:#1a1205;border-radius:99px;font-size:.68rem;min-width:18px;height:18px;display:grid;place-items:center;font-family:var(--f-data)}
.proto{font-size:.72rem;border:1px dashed var(--signal);color:var(--signal);border-radius:99px;padding:2px 9px;white-space:nowrap}
details.pop{position:relative}
details.pop>summary{list-style:none}
details.pop>summary::-webkit-details-marker{display:none}
.pop-body{position:absolute;inset-inline-end:0;top:calc(100% + 6px);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:min(330px,88vw);padding:8px;z-index:50}
.pop-body button.row{display:flex;justify-content:space-between;width:100%;background:none;border:0;padding:8px;border-radius:8px;cursor:pointer;text-align:start;gap:8px}
.pop-body button.row:hover{background:var(--surface-2)}
.pop-body .cap{font-size:.75rem;color:var(--muted);padding:6px 8px}

/* shell */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100% - 56px)}
.side{background:var(--ink);color:var(--ink-fg);padding:14px 10px 40px;border-inline-end:1px solid var(--ink-line)}
.side .grp{font-size:.72rem;letter-spacing:.04em;color:var(--ink-muted);padding:14px 10px 6px;display:flex;justify-content:space-between;gap:6px}
.side .grp b{font-weight:600;color:var(--signal);font-family:var(--f-display);font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side button.nav{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--ink-fg);padding:8px 10px;border-radius:8px;cursor:pointer;text-align:start;font-size:.9rem}
.side button.nav svg{width:17px;height:17px;flex:none;opacity:.8}
.side button.nav:hover{background:var(--ink-2)}
.side button.nav.on{background:var(--ink-2);box-shadow:inset -3px 0 0 var(--signal)}
[dir="ltr"] .side button.nav.on{box-shadow:inset 3px 0 0 var(--signal)}
.side button.nav .cnt{margin-inline-start:auto;font-family:var(--f-data);font-size:.72rem;background:var(--accent);color:var(--accent-fg);border-radius:99px;padding:0 7px}
.side button.nav .later{margin-inline-start:auto;font-size:.66rem;color:var(--ink-muted);border:1px solid var(--ink-line);border-radius:99px;padding:0 6px}
.side button.nav.muted{color:var(--ink-muted)}
main{padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1320px;margin:0 auto;display:grid;gap:18px}
.navtoggle{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .side.open{display:block}
  .navtoggle{display:inline-flex}
  .top .search input{width:120px}
}

/* page head */
.crumb{font-size:.78rem;color:var(--muted)}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph .sub{color:var(--muted);margin-top:2px;max-width:70ch}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:9px;padding:7px 13px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:.82rem;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.lnk{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:500;text-align:start}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.card>.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card>.bd{padding:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1000px){.g2,.g3{grid-template-columns:1fr}}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:2px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset-block:10px;inset-inline-start:0;width:4px;border-radius:0 4px 4px 0;background:var(--k,var(--line))}
.kpi .l{font-size:.8rem;color:var(--muted)}
.kpi .v{font-family:var(--f-data);font-size:1.7rem;font-weight:600;line-height:1.2;display:flex;align-items:baseline;gap:6px}
.kpi .v small{font-family:var(--f-body);font-size:.78rem;color:var(--muted);font-weight:500}
.kpi .s{font-size:.76rem;color:var(--muted)}
button.kpi{text-align:start;cursor:pointer;font:inherit;color:inherit}
button.kpi:hover{border-color:var(--accent)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:1px 9px;font-size:.78rem;font-weight:500;white-space:nowrap;background:var(--neutral-bg);color:var(--neutral)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--info-bg);color:var(--info)}
.pill.purple{background:var(--purple-bg);color:var(--purple)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:.75rem;color:var(--muted)}
.trk{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.trk i{width:9px;height:9px;border-radius:3px;display:inline-block}

/* table */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.toolbar input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;width:220px;max-width:100%}
.toolbar select,.field select,.field input,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 9px;max-width:100%}
.toolbar .sp{flex:1}
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 14px;background:var(--accent-soft);border-bottom:1px solid var(--line)}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:.87rem}
.tbl th{text-align:start;font-weight:600;font-size:.8rem;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl th button{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;display:inline-flex;gap:4px}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl td.n{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.pager .pg{display:flex;gap:4px}
.pager .pg button{min-width:30px;border:1px solid var(--line);background:var(--surface);border-radius:7px;cursor:pointer;padding:3px 7px;font-family:var(--f-data)}
.pager .pg button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
details.cols{position:relative}
details.cols summary{list-style:none;cursor:pointer}
details.cols .menu{position:absolute;inset-inline-end:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;z-index:20;box-shadow:var(--shadow);display:grid;gap:4px;min-width:200px}

/* empty / state */
.empty{padding:34px 16px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}
.empty b{color:var(--fg);font-family:var(--f-display)}
.note{border:1px solid var(--line);border-inline-start:4px solid var(--info);background:var(--surface);border-radius:10px;padding:10px 14px;font-size:.86rem}
.note.warn{border-inline-start-color:var(--signal)} .note.bad{border-inline-start-color:var(--bad)} .note.ok{border-inline-start-color:var(--ok)}
.denied{display:grid;place-items:center;padding:60px 16px;text-align:center;gap:10px}
.denied .code{font-family:var(--f-data);font-size:2.4rem;color:var(--bad)}

/* forms */
.form{display:grid;gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
@media (max-width:700px){.fgrid{grid-template-columns:1fr}}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:.8rem;font-weight:500;color:var(--muted)}
.field>span em{color:var(--bad);font-style:normal}
.field input,.field select,.field textarea{width:100%;padding:8px 10px}
.field textarea{min-height:76px;resize:vertical}
.field small{color:var(--muted);font-size:.75rem}
.field.full{grid-column:1/-1}
.chk{display:flex;gap:8px;align-items:center}
fieldset{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0;display:grid;gap:12px}
legend{font-family:var(--f-display);font-weight:600;padding:0 6px}
.err{color:var(--bad);font-size:.82rem}
.sum{font-family:var(--f-data);font-weight:600}
.sum.bad{color:var(--bad)} .sum.ok{color:var(--ok)}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(8,20,18,.45);z-index:70}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(640px,100%);background:var(--bg);z-index:71;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.18);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer .dh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.drawer .db{overflow:auto;padding:16px 18px;display:grid;gap:14px;align-content:start;flex:1}
.drawer .df{padding:12px 18px;border-top:1px solid var(--line);background:var(--surface);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:80;padding:16px}
.modal .box{background:var(--surface);border-radius:14px;width:min(520px,100%);max-height:86vh;overflow:auto;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal .box .bd{padding:18px;display:grid;gap:12px}
.modal .box .ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.toasts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-start:16px;z-index:90;display:grid;gap:8px}
.toast{background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);max-width:380px;font-size:.88rem}
.toast.bad{background:var(--bad);color:#fff}

/* misc */
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 12px;font-size:.88rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tl{display:grid;gap:8px;border-inline-start:2px solid var(--line);padding-inline-start:12px}
.tl div{font-size:.84rem} .tl small{color:var(--muted)}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.stack span{display:block;height:100%}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:99px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:5px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{background:none;border:0;padding:9px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-weight:500}
.tabs button.on{color:var(--fg);border-bottom-color:var(--signal)}
.list{display:grid}
.list>div,.list>button{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);background:none;border-inline:0;border-top:0;text-align:start;cursor:default;width:100%}
.list>button{cursor:pointer}
.list>*:last-child{border-bottom:0}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:2px 4px 2px 10px;font-size:.82rem;background:var(--surface)}
.chip.lead{border-color:var(--signal)}
.chip button{background:none;border:0;cursor:pointer;color:var(--muted);padding:0 4px}
.steps{display:flex;gap:0;flex-wrap:wrap}
.steps div{flex:1;min-width:140px;padding:10px 12px;border:1px solid var(--line);background:var(--surface);display:grid;gap:2px;font-size:.84rem}
.steps div:first-child{border-start-start-radius:10px;border-end-start-radius:10px}
.steps div:last-child{border-start-end-radius:10px;border-end-end-radius:10px}
.steps div b{font-family:var(--f-display)}
.steps div.done{background:var(--ok-bg)} .steps div.cur{background:var(--warn-bg)}
.hcard{display:grid;gap:10px;padding:16px;position:relative;overflow:hidden}
.hcard .lane{position:absolute;inset-block:0;inset-inline-start:0;width:6px}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:start}
.prose{max-width:78ch;display:grid;gap:10px}
.prose ul{margin:0;padding-inline-start:20px;display:grid;gap:4px}
.prose h2{margin-top:10px}
.score-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.scale{display:flex;gap:4px;flex-wrap:wrap}
.scale label{position:relative}
.scale input{position:absolute;opacity:0}
.scale span{display:grid;place-items:center;width:32px;height:32px;border:1px solid var(--line);border-radius:7px;font-family:var(--f-data);cursor:pointer;background:var(--surface)}
.scale input:checked+span{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.scale input:focus-visible+span{outline:2px solid var(--signal)}
.scale input:disabled+span{cursor:default;opacity:.7}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}.toast{animation:pop .2s ease-out}}
@keyframes slide{from{transform:translateX(-24px);opacity:.6}}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
</style>

</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   منصة إدارة الهاكاثونات — نموذج أولي (بيانات محلية تجريبية)
   الطبقة "api" تحاكي الخادم: كل تعديل يمر بفحص الصلاحية والنطاق.
   ========================================================= */
const API_URL='https://hackathon-admin-api.innovationraces.workers.dev/api';
const TOKEN_KEY='hk-admin-token';
let DB=null;

function setBusy(on){UI.busy=on;const el=document.getElementById('busy');if(el)el.hidden=!on}
async function call(action,args=[]){setBusy(true);
  try{let r;try{r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json',...(UI.token?{Authorization:'Bearer '+UI.token}:{})},body:JSON.stringify({action,args})})}
    catch(e){throw new Error('تعذر الاتصال بالخادم. تحقق من الإنترنت ثم حاول مجددًا.')}
    let j={};try{j=await r.json()}catch(e){throw new Error('تعذر قراءة رد الخادم.')}
    if(r.status===401&&j.auth===false){setToken(null);DB=null;UI.user=null;render();throw new Error(j.error)}
    if(!r.ok||j.error)throw (j.denied?new Denied(j.error):new Error(j.error||'تعذر تنفيذ الطلب.'));
    if(j.data){DB=j.data;UI.user=j.me}
    return j.result!==undefined&&j.result!==null?j.result:j}
  finally{setBusy(false)}}

/* effective criteria for a track: hackathon criteria (enabled) with optional track weights */
function critOf(trackId){const tr=T(trackId);const h=H(tr.hid);return h.criteria.filter(c=>c.enabled).map(c=>({...c,weight:tr.weights&&tr.weights[c.code]!=null?+tr.weights[c.code]:+c.weight}))}
function requiredJudges(p){return DB.judgeTracks.filter(j=>j.hid===p.hid&&j.trackId===p.trackId).map(j=>j.judgeId)
  .filter(j=>!DB.coi.some(c=>c.projectId===p.id&&c.judgeId===j&&c.status==='approved'))}
function teamCheck(tm){const h=H(tm.hid);const m=membersOf(tm.id);const miss=[];
  if(m.length<h.teamMin)miss.push(`ينقصه ${h.teamMin-m.length} عضو للحد الأدنى (${h.teamMin})`);
  if(m.length>h.teamMax)miss.push(`تجاوز الحد الأقصى (${h.teamMax})`);
  if(!tm.leaderId)miss.push('لم يُحدَّد قائد');
  if(!tm.trackId)miss.push('لم يُربط بمسار');
  if(!tm.challengeId)miss.push('لم يُربط بتحدٍ');
  if(!projOfTeam(tm.id))miss.push('لا يوجد مشروع');
  return {count:m.length,miss,ok:miss.length===0}}

/* ---------- permissions (تحاكي الفحص على الخادم) ---------- */
class Denied extends Error{}
const me=()=>U(UI.user);
const inScope=(u,hid)=>u.scope==='all'||(u.scope||[]).includes(hid);
function can(res,act,hid,u=me()){if(!u||!u.active)return false;const l=(MATRIX[u.role]||{})[res]||'';if(!l.includes(act))return false;if(hid&&!inScope(u,hid))return false;return true}
function guard(res,act,hid){if(!can(res,act,hid))throw new Denied(`لا تملك صلاحية «${ACTS[act]}» على «${RES[res]}»${hid?' في هذا الهاكاثون':''}.`)}
function guardScope(hid){const u=me();if(!u||!H(hid)||!inScope(u,hid))throw new Denied('هذا الهاكاثون خارج نطاق حسابك. لا يمكن عرض بياناته أو تعديلها.')}
const fail=m=>{throw new Error(m)};
function log(hid,action,detail){DB.audit.unshift({id:uid('l'),at:now(),userId:UI.user,hid:hid||null,action,detail:detail||''})}
function markStale(hid,why){const r=H(hid).results;if(r.state==='none')return;r.stale=true;if(r.state==='approved'){r.state='calculated';log(hid,'سحب اعتماد النتائج تلقائيًا',why)}}
function judgeCanSee(p,uid_){return requiredJudges(p).includes(uid_)&&['eligible','evaluated','final'].includes(p.status)}

/* ---------- validation helpers ---------- */
function validateH(d){const e=[];
  if(!d.nameAr?.trim())e.push('الاسم بالعربية مطلوب.');
  if(!d.eventStart||!d.eventEnd)e.push('حدد تاريخ بداية ونهاية الفعالية.');
  if(d.eventStart&&d.eventEnd&&d.eventStart>d.eventEnd)e.push('تاريخ نهاية الفعالية يسبق بدايتها.');
  if(d.regStart&&d.regEnd&&d.regStart>d.regEnd)e.push('نهاية التسجيل تسبق بدايته.');
  if(d.regEnd&&d.eventStart&&d.regEnd>d.eventStart)e.push('يجب أن ينتهي التسجيل قبل بداية الفعالية.');
  if(+d.teamMin<1||+d.teamMax<+d.teamMin)e.push('الحد الأدنى لحجم الفريق يجب أن يكون 1 أو أكثر ولا يتجاوز الحد الأقصى.');
  if(+d.scoreMin<0||+d.scoreMax<=+d.scoreMin)e.push('مقياس الدرجات غير صحيح: الحد الأقصى يجب أن يزيد على الحد الأدنى.');
  if(!d.allowIndividual&&!d.allowTeam)e.push('اسمح بنوع تسجيل واحد على الأقل (فردي أو فريق).');
  if(e.length)fail(e.join(' '))}

    DB.hackathons.push(h);log(h.id,'إنشاء هاكاثون',h.nameAr);commit();return h},
  updateHackathon(id,d){guard('hackathon','e',id);const h=H(id);if(h.status==='archived')fail('الهاكاثون مؤرشف. أعد تفعيله قبل التعديل.');
    if(d.scoreMin!=null&&(+d.scoreMin!==+h.scoreMin||+d.scoreMax!==+h.scoreMax)&&hasEvals(id))fail('لا يمكن تغيير مقياس الدرجات بعد تسليم تقييمات نهائية.');
    validateH({...h,...d});Object.assign(h,d);h.v++;log(id,'تعديل إعدادات الهاكاثون',Object.keys(d).length+' حقلًا');commit()},
  setHStatus(id,s){if(s==='published')guard('hackathon','p',id);else guard('hackathon','e',id);const h=H(id);
    if(s==='published'&&!tracksOf(id).length)fail('أضف مسارًا واحدًا على الأقل قبل النشر.');
    const old=h.status;h.status=s;log(id,'تغيير حالة الهاكاثون',`${HST[old][0]} ← ${HST[s][0]}`);commit()},
  saveCriteria(hid,list){guard('criteria',list.some(c=>c.isNew)?'c':'e',hid);const h=H(hid);
    if(hasEvals(hid))fail('بدأ تسليم التقييمات النهائية. لا يمكن تعديل المعايير أو أوزانها الآن.');
    const codes=list.map(c=>c.code.trim());
    if(list.some(c=>!c.code.trim()||!c.nameAr.trim()))fail('لكل معيار رمز واسم بالعربية.');
    if(new Set(codes).size!==codes.length)fail('رموز المعايير يجب ألا تتكرر.');
    if(list.some(c=>!/^[a-z0-9_]+$/.test(c.code.trim())))fail('الرمز بحروف إنجليزية صغيرة وأرقام و _ فقط (مثل technical_impl).');
    const s=sum(list.filter(c=>c.enabled).map(c=>c.weight));if(s!==100)fail(`مجموع أوزان المعايير المفعّلة ${s}%، ويجب أن يكون 100%.`);
    h.criteria=list.map(c=>({id:c.id||uid('c'),code:c.code.trim(),nameAr:c.nameAr.trim(),weight:+c.weight,enabled:!!c.enabled}));
    h.tieOrder=(h.tieOrder||[]).filter(k=>codes.includes(k));log(hid,'تعديل معايير التحكيم',`${list.length} معايير`);commit()},
  saveTrack(hid,d,challengeLines){guard('track',d.id?'e':'c',hid);
    if(!d.nameAr?.trim())fail('اسم المسار بالعربية مطلوب.');
    if(+d.winners<0||+d.winners>10)fail('عدد المراكز الفائزة بين 0 و10.');
    if(d.weights){const s=sum(Object.values(d.weights));if(s!==100)fail(`مجموع الأوزان الخاصة بالمسار ${s}%، ويجب أن يكون 100%.`);
      if(hasEvals(hid)){const old=d.id?T(d.id).weights:null;if(JSON.stringify(old)!==JSON.stringify(d.weights))fail('لا يمكن تعديل أوزان المسار بعد تسليم تقييمات نهائية.')}}
    let tr;if(d.id){tr=T(d.id);Object.assign(tr,d)}else{tr={...d,id:uid('t'),hid,order:tracksOf(hid).length+1};DB.tracks.push(tr)}
    const titles=challengeLines.map(s=>s.trim()).filter(Boolean);const cur=DB.challenges.filter(c=>c.trackId===tr.id);
    cur.filter(c=>!titles.includes(c.title)).forEach(c=>{if(DB.teams.some(t=>t.challengeId===c.id))fail(`لا يمكن حذف التحدي «${c.title}» لأنه مرتبط بفريق.`)});

    titles.forEach(ti=>{if(!cur.some(c=>c.title===ti))DB.challenges.push({id:uid('ch'),hid,trackId:tr.id,title:ti})});
    log(hid,d.id?'تعديل مسار':'إضافة مسار',tr.nameAr);commit();return tr},
  deleteTrack(id){const tr=T(id);guard('track','d',tr.hid);

/* ---------- results engine ---------- */
function projectScore(p){const h=H(p.hid);const crit=critOf(p.trackId);const req=requiredJudges(p);
  const evs=DB.evals.filter(e=>e.projectId===p.id&&e.status==='submitted'&&req.includes(e.judgeId));
  const per=evs.map(e=>sum(crit.map(c=>(e.scores[c.code]/h.scoreMax)*c.weight)));
  const critAvg={};crit.forEach(c=>{critAvg[c.code]=avg(evs.map(e=>e.scores[c.code]))});
  const drafts=DB.evals.filter(e=>e.projectId===p.id&&e.status==='draft'&&req.includes(e.judgeId)).length;
  return {req,evs,per,score:per.length?avg(per):null,critAvg,complete:req.length>0&&evs.length===req.length,drafts}}
function computeResults(hid){const h=H(hid);const ov=h.results.overrides||{};const rows=[];
  tracksOf(hid).forEach(tr=>{const ps=projectsOf(hid).filter(p=>p.trackId===tr.id&&['eligible','evaluated','final'].includes(p.status));
    let list=ps.map(p=>{const s=projectScore(p);return {projectId:p.id,trackId:tr.id,teamId:p.teamId,score:s.score,critAvg:s.critAvg,complete:s.complete,done:s.evs.length,required:s.req.length,rank:null,prize:'',tie:false,tieUnresolved:false,adjusted:null,excluded:false}});
    list.forEach(x=>{x.excluded=x.score==null||(h.incompletePolicy==='block'&&!x.complete)});
    const ranked=list.filter(x=>!x.excluded);
    const cmp=(a,b)=>{const d=b.score-a.score;if(Math.abs(d)>1e-9)return d;if(h.tieRule==='criteria'){for(const k of h.tieOrder||[]){const e=(b.critAvg[k]||0)-(a.critAvg[k]||0);if(Math.abs(e)>1e-9)return e}}return 0};
    ranked.sort(cmp);let rk=0;ranked.forEach((x,i)=>{if(i>0&&cmp(ranked[i-1],x)===0){x.rank=ranked[i-1].rank;x.tie=ranked[i-1].tie=true}else{rk=i+1;x.rank=rk}});
    ranked.forEach(x=>{if(x.tie&&h.tieRule!=='shared')x.tieUnresolved=true});
    ranked.forEach(x=>{const o=ov[x.projectId];if(o){x.rank=o.rank;x.adjusted=o;x.tieUnresolved=false}});
    // resolved if every tied group now has distinct ranks
    const byRank={};ranked.forEach(x=>{(byRank[x.rank]=byRank[x.rank]||[]).push(x)});ranked.forEach(x=>{if(h.tieRule!=='shared'&&byRank[x.rank].length>1&&!x.adjusted)x.tieUnresolved=true;if(byRank[x.rank].length===1)x.tieUnresolved=false});
    ranked.sort((a,b)=>a.rank-b.rank);ranked.forEach(x=>{if(x.rank<=tr.winners)x.prize=tr.prizes[x.rank-1]||`المركز ${x.rank}`});
    rows.push(...ranked,...list.filter(x=>x.excluded))});
  return {rows}}

/* ---------- generic table ---------- */
function table(id,cols,rows,o={}){
  const st=UI.tables[id]||(UI.tables[id]={q:'',sort:o.sort||null,dir:o.dir||1,page:1,size:10,hidden:o.hidden||[],f:{}});
  let r=rows;const txt=(c,x)=>c.text?String(c.text(x)??''):'';
  if(st.q){const q=st.q.trim().toLowerCase();r=r.filter(x=>cols.some(c=>txt(c,x).toLowerCase().includes(q)))}
  (o.filters||[]).forEach(f=>{const v=st.f[f.key];if(v)r=r.filter(x=>String(f.get(x))===v)});
  if(st.sort){const c=cols.find(c=>c.key===st.sort);if(c){const g=c.sortv||(x=>txt(c,x));r=[...r].sort((a,b)=>{const A_=g(a),B_=g(b);return (A_>B_?1:A_<B_?-1:0)*st.dir})}}
  const total=r.length,pages=Math.max(1,Math.ceil(total/st.size));st.page=Math.min(st.page,pages);
  const slice=r.slice((st.page-1)*st.size,st.page*st.size);const vis=cols.filter(c=>!st.hidden.includes(c.key));
  const sel=UI.sel[id]||(UI.sel[id]=new Set());if(o.select)[...sel].forEach(k=>{if(!rows.some(x=>x.id===k))sel.delete(k)});
  const allOn=o.select&&slice.length&&slice.every(x=>sel.has(x.id));
  let h=`<div class="toolbar"><label class="sr" for="${id}-q">بحث</label><input type="search" id="${id}-q" placeholder="بحث…" value="${esc(st.q)}" data-in="tq" data-t="${id}">`;
  (o.filters||[]).forEach(f=>{h+=`<label class="sr" for="${id}-f-${f.key}">${esc(f.label)}</label><select id="${id}-f-${f.key}" data-ch="tf" data-t="${id}" data-k="${f.key}"><option value="">${esc(f.label)}: الكل</option>${f.opts.map(([v,l])=>`<option value="${esc(v)}" ${st.f[f.key]===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`});
  h+=`<span class="sp"></span>${o.tools||''}<details class="cols"><summary class="btn sm">الأعمدة</summary><div class="menu">${cols.filter(c=>!c.fixed).map(c=>`<label class="chk"><input type="checkbox" data-ch="tcol" data-t="${id}" data-k="${c.key}" ${st.hidden.includes(c.key)?'':'checked'}> ${esc(c.label)}</label>`).join('')}</div></details></div>`;
  if(o.select&&sel.size)h+=`<div class="bulk"><b>${sel.size}</b> محدد ${o.bulk?o.bulk([...sel]):''}<button class="lnk" data-a="tclear" data-t="${id}">إلغاء التحديد</button></div>`;
  h+=`<div class="tbl-wrap"><table class="tbl"><thead><tr>${o.select?`<th style="width:34px"><input type="checkbox" aria-label="تحديد الصفحة" data-ch="tall" data-t="${id}" ${allOn?'checked':''}></th>`:''}${vis.map(c=>`<th>${c.nosort?esc(c.label):`<button data-a="tsort" data-t="${id}" data-k="${c.key}">${esc(c.label)}${st.sort===c.key?(st.dir>0?' ↑':' ↓'):''}</button>`}</th>`).join('')}</tr></thead><tbody>`;
  if(!slice.length)h+=`<tr><td colspan="${vis.length+(o.select?1:0)}">${empty(rows.length?'لا توجد نتائج مطابقة':(o.emptyTitle||'لا توجد سجلات بعد'),rows.length?'غيّر البحث أو الفلاتر.':(o.emptyHint||''))}</td></tr>`;
  slice.forEach(x=>{h+=`<tr ${o.row?`class="click" data-a="${o.row}" data-id="${esc(x.id)}" tabindex="0"`:''}>${o.select?`<td><input type="checkbox" aria-label="تحديد" data-ch="tsel" data-t="${id}" data-id="${esc(x.id)}" ${sel.has(x.id)?'checked':''}></td>`:''}${vis.map(c=>`<td class="${c.num?'n':''}">${c.html?c.html(x):esc(txt(c,x))}</td>`).join('')}</tr>`});
  const pgs=[];for(let i=1;i<=pages;i++){if(i===1||i===pages||Math.abs(i-st.page)<=1)pgs.push(i);else if(pgs[pgs.length-1]!=='…')pgs.push('…')}
  h+=`</tbody></table></div><div class="pager"><span>عرض <span class="num">${total?(st.page-1)*st.size+1:0}–${Math.min(st.page*st.size,total)}</span> من <span class="num">${total}</span></span>
   <label>لكل صفحة <select data-ch="tsize" data-t="${id}">${[10,25,50].map(n=>`<option ${st.size===n?'selected':''}>${n}</option>`).join('')}</select></label>
   <span class="pg">${pgs.map(p=>p==='…'?'<span>…</span>':`<button class="${p===st.page?'on':''}" data-a="tpage" data-t="${id}" data-k="${p}" aria-label="صفحة ${p}">${p}</button>`).join('')}</span></div>`;
  return `<div class="card" style="overflow:hidden">${h}</div>`}
function csvOf(cols,rows){const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;return '﻿'+[cols.map(c=>q(c.label)).join(','),...rows.map(r=>cols.map(c=>q(c.text(r))).join(','))].join('\n')}

/* ---------- analysis page ---------- */
function pg_about(){return `<div class="wrap"><div class="card"><div class="bd prose">
<div class="crumb">${t('الشركة')}</div><h1>فهم المنصة والخطة</h1>
<div class="note ok">المنصة مربوطة بقاعدة Airtable «Participant Registration &amp; Management» عبر خادم Cloudflare Worker يطبّق تسجيل الدخول والصلاحيات وعزل الهاكاثونات. كل التعديلات تُحفظ في Airtable مباشرة.</div>
<h2>1. ملخص فهمي للمنصة</h2>
<p>منصة داخلية لفريق الشركة تدير عدة هاكاثونات من حساب مركزي. لكل هاكاثون بياناته المعزولة: الإعدادات، المسارات والتحديات، الطلبات، الفرق، المشاريع، التحكيم، النتائج، ومتابعة الحلول بعد الفعالية. المحكم يدخل بحساب محدود يرى فيه المشاريع المسندة إليه فقط. لا توجد بوابة مشاركين في هذه النسخة.</p>
<h2>2. ما استخرجته من الصور (11 صورة)</h2>
<ul>
<li><b>القائمة الجانبية:</b> لوحة التحكم، دليل المستخدم، الفرز والقبول (المشاركون)، إعداد الهاكاثون (الهاكاثونات، المسارات، التحديات، الجهات المنظمة والشركاء، الأسئلة الشائعة، الأجندة)، الفرق (الفرق، سجل التحديات، جلسات التحكيم)، الإرشاد (طلبات الإرشاد، المرشدون، حجوزات الإرشاد، ملاحظات الإرشاد)، التسليمات، التحكيم (طلبات التحكيم، معايير التحكيم). الجزء الأسفل من القائمة مقصوص في الصورة.</li>
<li><b>لوحة التحكم:</b> بطاقات: المشاركون، المقبولون، الفرق، التسليمات، تقدم التحكيم، تقييمات معلقة، حجوزات الإرشاد، شهادات صادرة. جدول «Judging Progress» بأعمدة: الاسم بالعربية والإنجليزية، مكتملة، مكتملة (عمود مكرر)، قيد التقييم، النسبة.</li>
<li><b>المشاركون:</b> زر تصدير. مؤشرات: إجمالي التسجيلات، قيد المراجعة، مقبول، بدون فريق. أعمدة: الاسم بالعربية والإنجليزية، الجهة، نوع الجهة، التخصص، المسار المفضل، الأهلية، حالة التسجيل، حالة الفريق، تاريخ التسجيل. بحث وفلترة واختيار أعمدة.</li>
<li><b>معايير التحكيم:</b> مجموع الأوزان، أعمدة: الرمز، الاسم (عربي)، الوزن، المقياس، مفعّل. تظهر المعايير على مستوى الهاكاثون لا المسار.</li>
<li><b>النتائج:</b> الترتيب داخل المسار، المركز الفائز، الفريق، المسار، النتيجة النهائية، التقييمات المكتملة، الحالة، اعتماد مدير النظام، تاريخ النشر.</li>
<li><b>التسليمات:</b> الرقم المرجعي، الفريق، المسار، الحالة، النسخة، قائمة التحقق، وقت التسليم، الموعد النهائي الفعلي.</li>
<li><b>المستخدمون:</b> الاسم بالعربية والإنجليزية، البريد، الأدوار، المشارك، الفضاء الافتراضي، محظور، أُنشئ في. حوالي 19 صفحة، ما يعني أن المشاركين لهم حسابات في النظام الحالي.</li>
<li><b>الإعدادات:</b> جدول مفتاح/قيمة بأنواع تقنية (integer, boolean, array): مقياس 1–10، قبول طلبات الانضمام للتحكيم والإرشاد، مدة جلسة الإرشاد 20 دقيقة، حد جلسات الإرشاد اليومية 2، فتح الحجز قبل 1440 دقيقة، إشعارات واتساب، ترتيب كسر التعادل (معيار الأثر المؤسسي ثم التنفيذ التقني ثم يدوي)، الموعد النهائي للتسليم، حجم الملف 20480 كيلوبايت، الامتدادات pdf/pptx/ppt، حجم الفريق 5–7، 15 فريقًا مؤكدًا كحد أقصى، موعدا تشكيل الفريق وتأكيده.</li>
<li><b>إضافة هاكاثون:</b> النسخة، الاسم عربي/إنجليزي، وقت البداية والنهاية، المنطقة الزمنية، الحالة، مفتاح «الهاكاثون النشط»، الوصف.</li>
<li><b>الشهادات:</b> معاينة التصاميم، إصدار شهادات المشاركة والفائزين ولمستخدم محدد. أعمدة: رمز التحقق، المستفيد، النوع، فئة التقدير، الفريق، الحالة، تاريخ الإصدار.</li>
<li><b>لم أستطع قراءته:</b> كل الجداول في الصور فارغة، فلا توجد قيم حالات فعلية أو بيانات. لم تظهر شاشة تفاصيل طلب أو فريق أو تقييم، ولا قيم الحالات المتاحة.</li></ul>
<h2>نقاط تحسين من الصور طبّقتها</h2>
<ul><li>النظام الحالي يعتمد «هاكاثون نشط» واحدًا بمفتاح. استبدلته بمحدد هاكاثون دائم في الشريط العلوي مع لون واسم ظاهرين، ونطاق صلاحيات لكل مستخدم.</li>
<li>الإعدادات معروضة كمفاتيح تقنية بأنواع بيانات. حوّلتها لنموذج مقسم بعناوين مفهومة وتحقق من القيم.</li>
<li>فصلت الأهلية عن قرار القبول، وجعلت الانتقالات مقيدة ولها أثر (الانسحاب يزيل العضو من فريقه، القبول يتطلب الأهلية).</li>
<li>عنوان «Judging Progress» غير مترجم والعمود «مكتملة» مكرر. استبدلته بمؤشر واضح: مطلوب/مسلَّم/مسودة.</li>
<li>عرضت الوحدات صراحة في المؤشرات: «طلب» و«شخص» و«فريق».</li></ul>
<h2>3. خريطة الشاشات والعلاقات</h2>

<h2>4. رحلة العمل</h2>
<ul><li>إنشاء الهاكاثون كمسودة ← ضبط الإعدادات والمعايير ← إضافة المسارات والتحديات ← النشر.</li>
<li>استقبال الطلبات ← مراجعة الأهلية ← قرار القبول ← إسناد المقبولين لفرق.</li>
<li>إنشاء مشروع الفريق ← تسجيل نسخ التسليم ← مراجعة ← «مؤهلة للتحكيم».</li>
<li>إسناد المحكمين للمسارات ← معالجة الإفصاح عن التعارض ← جدولة الجلسات مع كشف التعارض ← تقييم المحكم (مسودة ثم تسليم نهائي).</li>
<li>احتساب النتائج ← مراجعة الناقص والتعادل ← اعتماد ← نشر الحقول المسموحة فقط ← متابعة الحلول المتبناة.</li></ul>
<h2>طريقة الاحتساب</h2>
<p>درجة المحكم للمشروع = مجموع (الدرجة ÷ الحد الأقصى للمقياس × وزن المعيار)، والنتيجة من 100. نتيجة المشروع = متوسط درجات المحكمين المطلوبين الذين سلّموا نهائيًا. المحكم المستبعد بتعارض مصالح لا يُحتسب ضمن المطلوبين. إذا كانت السياسة «منع الاعتماد» يُستبعد المشروع الناقص من الترتيب ويُمنع الاعتماد حتى يكتمل.</p>
<h2>5. افتراضات ونقاط تحتاج تأكيدًا</h2>
<ul><li>المعايير في الصور على مستوى الهاكاثون، والمتطلبات تطلبها لكل مسار. جعلتها على مستوى الهاكاثون مع خيار أوزان خاصة لكل مسار. <b>هل هذا مناسب؟</b></li>
<li>النظام الحالي فيه حسابات مشاركين و«فضاء افتراضي». <b>هل تُنقل بوابة المشاركين للنسخة الأولى أم تبقى في النظام الحالي؟</b></li>
<li>الإرشاد والشهادات موجودة في النظام الحالي وغير مذكورة في المتطلبات. وضعتها في «لاحقًا». <b>هل هي ضمن النطاق؟</b></li>
<li>حالات الطلبات المستخدمة مقترحة لأن الجداول في الصور فارغة.</li>
<li>الإفصاح عن تعارض المصالح: المحكم أو مسؤول التحكيم يسجله، ومسؤول التحكيم يعتمد الاستبعاد. <b>توصية تحتاج اعتمادًا.</b></li>
<li>«اعتماد مدير النظام» في جدول النتائج: جعلت الاعتماد متاحًا لمدير النظام ومدير الهاكاثون. <b>هل يقتصر على مدير النظام؟</b></li>
<li>لا يوجد تكامل مع الموقع العام أو نموذج التسجيل قبل فحص واجهاتهما.</li></ul>
<h2>ما لم يُنفذ في هذه النسخة</h2>
<ul><li>رفع الشعار وملفات التسليم إلى Airtable من داخل المنصة (الحقول موجودة، والرفع لم يُربط بعد).</li><li>النسخ الاحتياطي الدوري: يعتمد حاليًا على Snapshots في Airtable.</li><li>الأجندة، الجهات والشركاء، الأسئلة الشائعة، الإرشاد، الشهادات، الملفات والتقارير المتقدمة.</li><li>رفع الملفات الفعلي للتسليمات، والنشر الفعلي للواجهة العامة (تظهر معاينة للحقول المسموحة فقط).</li><li>التنزيل المباشر لملفات Excel (التصدير الآن نص CSV للنسخ).</li><li>الترجمة الكاملة للمحتوى: التبديل للإنجليزية يغيّر الاتجاه وعناوين القوائم فقط.</li></ul>
<h2>قائمة التطوير اللاحقة</h2>
<ul><li>التدريب والمحاكاة.</li><li>مساعد ذكاء اصطناعي لتلخيص الأفكار أو دعم التحكيم.</li><li>إشعارات خارجية (بريد/واتساب) بعد الموافقة على الخدمة وبيانات الدخول.</li></ul>

   {key:'score',label:'النتيجة النهائية /100',text:x=>r1(x.score),sortv:x=>x.score??-1,num:1},{key:'done',label:'التقييمات المكتملة',text:x=>`${x.done}/${x.required}`,html:x=>`<span class="num">${x.done}/${x.required}</span> ${x.complete?'':'<span class="pill warn">ناقص</span>'}`},
   {key:'st',label:'الحالة',text:()=>RST[st][0],html:()=>pill(RST,st)},{key:'ap',label:'الاعتماد',text:()=>r.approvedBy?uname(r.approvedBy):'—'},{key:'pub',label:'تاريخ النشر',text:()=>st==='published'?fmtDT(r.publishedAt):'—'},

   `${can('results','x',h.id)&&rows.length?btn('تصدير','export',{k:'results'}):''}${can('results','c',h.id)&&st!=='published'?btn(st==='none'?'احتساب النتائج':'إعادة الاحتساب','calc',{},'pri'):''}`)}
  <div class="steps">${steps.map(([l,k],i)=>`<div class="${i<=idx?'done':i===idx+1?'cur':''}"><b>${i+1}. ${l}</b><span class="muted">${i===0?(r.calcAt?`${fmtDT(r.calcAt)} · ${esc(uname(r.calcBy))}`:'لم يتم'):i===1?(r.approvedAt?`${fmtDT(r.approvedAt)} · ${esc(uname(r.approvedBy))}`:'لم يتم'):(r.publishedAt&&st==='published'?fmtDT(r.publishedAt):'لم يتم')}</span></div>`).join('')}</div>
  <div class="note"><b>قاعدة الاحتساب:</b> درجة المحكم = Σ (الدرجة ÷ ${h.scoreMax} × وزن المعيار). نتيجة المشروع = متوسط درجات المحكمين المطلوبين المسلَّمة. <b>التعادل:</b> ${TIE[h.tieRule]}${h.tieRule==='criteria'?` (${(h.tieOrder||[]).map(k=>h.criteria.find(c=>c.code===k)?.nameAr||k).join(' ← ')||'لم يُحدد ترتيب'})`:''}. <b>الناقص:</b> ${INC[h.incompletePolicy]}. ${btn('تعديل القواعد','go',{p:'settings'},'sm')}</div>

  ${ties.length?`<div class="note warn"><b>تعادل يحتاج قرارًا:</b> ${ties.map(x=>esc(PR(x.projectId).title)).join('، ')}. استخدم «تعديل الترتيب» مع ذكر السبب.</div>`:''}
  ${st==='none'?`<div class="card">${empty('لم تُحتسب النتائج بعد','اضغط «احتساب النتائج» بعد اكتمال التقييمات. يمكن الاحتساب للمراجعة في أي وقت.')}</div>`:table('res',cols,rows,{sort:'rank',filters:[{key:'tr',label:'المسار',get:x=>x.trackId,opts:tracksOf(h.id).map(x=>[x.id,x.nameAr])}]})}

   <div class="acts">${st==='calculated'&&can('results','a',h.id)?btn('اعتماد النتائج','approve',{},'pri'):''}${st==='approved'&&can('results','p',h.id)?btn('نشر النتائج','publish',{},'pri'):''}${st==='published'&&can('results','p',h.id)?btn('إيقاف النشر','unpublish',{}):''}</div>

  try{if(d.type==='app'){const a=A(d.id);guardScope(a.hid);if(!can('application','v',a.hid))throw new Denied('لا تملك صلاحية عرض الطلبات.');inner=appDrawer(a)}
   else if(d.type==='newapp')inner=newAppDrawer(h);
   else if(d.type==='team')inner=teamDrawer(h,d.id?TM(d.id):null);
   else if(d.type==='proj'){const p=PR(d.id);guardScope(p.hid);inner=projDrawer(p)}
   else if(d.type==='projnew')inner=`<div class="dh"><div><div class="crumb">${esc(h.nameAr)}</div><h2>مشروع جديد</h2></div><button class="btn sm" data-a="close">إغلاق</button></div><div class="db">${projForm(h,null)}</div>`;
   else if(d.type==='track')inner=trackDrawer(h,d.id?T(d.id):null);
   else if(d.type==='session')inner=sessionDrawer(h,d.id?DB.sessions.find(s=>s.id===d.id):null);
   else if(d.type==='eval'){const p=PR(d.id);if(!judgeCanSee(p,UI.user))throw new Denied('هذا المشروع غير مسند إليك.');inner=evalDrawer(p)}
   else if(d.type==='user')inner=userDrawer(d.id?U(d.id):null,d.role);
   else if(d.type==='preview')inner=previewDrawer(H(d.id));
  }catch(e){inner=`<div class="dh"><h2>غير متاح</h2><button class="btn sm" data-a="close">إغلاق</button></div><div class="db">${denied(e.message)}</div>`}
  return `<div class="scrim" data-a="close"></div><aside class="drawer" role="dialog" aria-modal="true">${inner}</aside>`}

   <label class="field"><span>الاسم (عربي) <em>*</em></span><input id="tr-ar" name="nameAr" value="${esc(tr?.nameAr||'')}"></label><label class="field"><span>الاسم (إنجليزي)</span><input id="tr-en" name="nameEn" dir="ltr" value="${esc(tr?.nameEn||'')}"></label>

   <label class="field"><span>الجوائز (جائزة في كل سطر بترتيب المراكز)</span><textarea id="tr-pr" name="prizes">${esc((tr?.prizes||[]).join('\n'))}</textarea></label>

const busyHtml=()=>`<div id="busy" class="toast" style="position:fixed;top:calc(12px + env(safe-area-inset-top,0px));inset-inline-start:50%;transform:translateX(50%);z-index:95" ${UI.busy?'':'hidden'}>جارٍ الاتصال بالخادم…</div>`;
function render(){const app=document.getElementById('app');if(!app)return;
  if(!UI.token){app.innerHTML=authPage();renderToasts();return}
  if(!DB||!me()){app.innerHTML=`<div class="denied"><div class="empty"><b>جارٍ تحميل البيانات من Airtable…</b></div></div>${busyHtml()}<div class="toasts" id="toasts"></div>`;renderToasts();return}
  const u=me();
  const hs=visibleHackathons();if(!UI.hid||!hs.some(h=>h.id===UI.hid)&&!UI.forceH)UI.hid=(hs.find(h=>h.status!=='archived')||hs[0])?.id||null;
  if(me().role==='judge'&&!['myreviews','about'].includes(UI.page))UI.page='myreviews';
  document.documentElement.setAttribute('dir',UI.lang==='ar'?'rtl':'ltr');document.documentElement.setAttribute('lang',UI.lang);
  const fn=PAGES[UI.page]||(UI.page.startsWith('later_')?()=>pg_later({later_agenda:'الأجندة',later_partners:'الجهات والشركاء',later_faq:'الأسئلة الشائعة',later_mentor:'الإرشاد',later_cert:'الشهادات',later_files:'الملفات والتقارير'}[UI.page]):pg_dash);
  let body;try{body=fn()}catch(e){body=denied(e.message)}
  app.innerHTML=topbar()+`<div class="shell">${sidebar()}<main id="main" tabindex="-1">${body}</main></div>${drawerHtml()}${modalHtml()}${busyHtml()}<div class="toasts" id="toasts"></div>`;
  renderToasts();UI.forceH=false;
  if(UI.focus){const el=document.getElementById(UI.focus);if(el){el.focus();if(el.setSelectionRange){const n=el.value.length;try{el.setSelectionRange(n,n)}catch(_){}}}UI.focus=null}
  const ts=document.getElementById('trSum');if(ts)updTrSum();
}
function updTrSum(){const els=[...document.querySelectorAll('#trW input[type=number]')];const s=sum(els.map(e=>e.value));const el=document.getElementById('trSum');if(el){el.textContent=s+'%';el.className='sum '+(s===100?'ok':'bad')}}
function updCSum(){const rows=[...document.querySelectorAll('[data-crow]')];const s=sum(rows.filter(r=>r.querySelector('[name=en]').checked).map(r=>r.querySelector('[name=w]').value));const el=document.getElementById('cSum');if(el){el.textContent=s+'%';el.className='sum '+(s===100?'ok':'bad')}}

  tieup:d=>{const h=H(UI.hid);const boxes=[...document.querySelectorAll('[data-tie]')];const order=boxes.map(b=>b.dataset.tie);const on=new Set(boxes.filter(b=>b.checked).map(b=>b.dataset.tie));const i=order.indexOf(d.k);if(i>0){[order[i-1],order[i]]=[order[i],order[i-1]]}

  tedit:d=>{UI.drawer={type:'track',id:d.id};render()},tmove:d=>run(()=>api.moveTrack(d.id,+d.d)),
  tdel:d=>confirmBox({title:'حذف المسار؟',body:`<p>سيُحذف «${esc(T(d.id).nameAr)}» وتحدياته وإسنادات محكميه. يُمنع الحذف إذا ارتبط بفرق أو مشاريع.</p>`,ok:'حذف',danger:1,fn:async()=>{await api.deleteTrack(d.id);toast('حُذف المسار.')}}),

  openapp:d=>{UI.drawer={type:'app',id:d.id};render()},newapp:()=>{UI.drawer={type:'newapp'};render()},newappsubmit:()=>SUBMIT.newappsubmit(),
  appedit:d=>{UI.drawer.edit=!!d.on;render()},appsubmit:()=>SUBMIT.appsubmit(),notesubmit:()=>SUBMIT.notesubmit(),
  elig:d=>{const r=document.getElementById('decReason')?.value||'';run(()=>api.setElig(d.id,d.to,r),'تم تحديث الأهلية.')},
  dec:d=>{const r=document.getElementById('decReason')?.value||'';if(d.to==='rejected'||d.to==='withdrawn'){confirmBox({title:`${DEC_VERB[d.to]} الطلب؟`,body:`<p>${d.to==='withdrawn'&&A(d.id).teamId?'سيُزال المشارك من فريقه. ':''}السبب المكتوب: ${esc(r||'— لم يُكتب سبب —')}</p>`,ok:DEC_VERB[d.to],danger:1,fn:async()=>{await api.setDecision(d.id,d.to,r);toast('حُدّث القرار.')}})}else run(()=>api.setDecision(d.id,d.to,r),'حُدّث القرار.')},
  assignsel:d=>{const v=document.getElementById('asgTeam').value;if(!v)return toast('اختر فريقًا.',true);run(()=>api.assign(d.id,v),'تم الإسناد.')},
  unassign:d=>confirmBox({title:'إزالة المشارك من الفريق؟',body:`<p>${esc(A(d.id).name)} سيعود إلى قائمة «بدون فريق».</p>`,ok:'إزالة',danger:1,fn:async()=>{await api.unassign(d.id);toast('أُزيل من الفريق.')}}),
  leader:d=>run(()=>api.setLeader(d.t,d.id),'حُدّد القائد.'),
  bulk:d=>{const ids=[...UI.sel.apps];const [kind,to]=[d.op.split('_')[0],d.op.split('_').slice(1).join('_')];const needR=(kind==='elig'&&to!=='eligible')||(kind==='dec'&&['rejected'].includes(to));
    const label=kind==='elig'?`الأهلية: ${ELIG[to][0]}`:`القرار: ${DEC[to][0]}`;
    confirmBox({title:`إجراء جماعي — ${label}`,body:`<p>سيُطبَّق على <b class="num">${ids.length}</b> طلب. السجلات التي لا يسمح انتقالها ستظهر مع السبب.</p>`,reason:needR?'السبب (مطلوب)':'ملاحظة (اختيارية)',ok:'تنفيذ',
      fn:async()=>{const r=document.getElementById('mReason')?.value||'';const res=await api.bulkApps(ids,kind,to,r);UI.sel.apps.clear();
        setTimeout(()=>confirmBox({title:'نتيجة الإجراء الجماعي',body:`<p>نجح: <b class="num">${res.ok.length}</b> · تعذر: <b class="num">${res.failed.length}</b></p>${res.failed.length?`<div class="list">${res.failed.map(f=>`<div><span>${esc(f.name)}</span><small class="muted" style="max-width:60%">${esc(f.msg)}</small></div>`).join('')}</div>`:''}`,cancel:'إغلاق'}),0)}})},
  teamedit:d=>{UI.drawer={type:'team',id:d.id};render()},teamsubmit:()=>SUBMIT.teamsubmit(),
  teamdel:d=>confirmBox({title:'حذف الفريق؟',body:`<p>سيعود أعضاء «${esc(TM(d.id).name)}» إلى قائمة «بدون فريق».</p>`,ok:'حذف',danger:1,fn:async()=>{await api.deleteTeam(d.id);toast('حُذف الفريق.')}}),
  openproj:d=>{UI.drawer={type:'proj',id:d.id};render()},projedit:d=>{UI.drawer=d.id?{type:'proj',id:d.id,edit:true}:{type:'projnew'};render()},projcancel:d=>{UI.drawer={type:'proj',id:d.id};render()},projsubmit:()=>SUBMIT.projsubmit(),
  pstatus:d=>{const n=document.getElementById('projNote')?.value||'';run(()=>api.setProjStatus(d.id,d.to,n),'حُدّثت حالة المشروع.')},
  subadd:d=>reasonModal('تسجيل نسخة تسليم','وصف النسخة (اختياري)',async r=>{await api.addSubmission(d.id,r);toast('سُجّلت النسخة.')},{body:'<p class="muted">رفع الملفات الفعلي غير منفذ في النموذج الأولي؛ تُسجل النسخة ووقتها فقط.</p>'}),
  followsubmit:()=>SUBMIT.followsubmit(),
  sesedit:d=>{UI.drawer={type:'session',id:d.id};render()},sessubmit:()=>SUBMIT.sessubmit(),
  sesdel:d=>confirmBox({title:'حذف الجلسة؟',ok:'حذف',danger:1,fn:async()=>{await api.deleteSession(d.id);toast('حُذفت الجلسة.')}}),
  coinew:()=>{const h=H(UI.hid);confirmBox({title:'تسجيل إفصاح عن تعارض مصالح',reason:'طبيعة التعارض',ok:'تسجيل',
    extra:`<div class="fgrid"><label class="field"><span>المحكم</span><select id="coiJ">${DB.users.filter(u=>u.role==='judge'&&inScope(u,h.id)).map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></label><label class="field"><span>المشروع</span><select id="coiP">${projectsOf(h.id).map(p=>`<option value="${p.id}">${esc(p.title)}</option>`).join('')}</select></label></div>`,
    fn:async()=>{await api.declareCOI(document.getElementById('coiP').value,document.getElementById('coiJ').value,document.getElementById('mReason').value);toast('سُجّل الإفصاح.')}})},
  coiok:d=>confirmBox({title:'اعتماد استبعاد المحكم؟',body:'<p>لن يرى المحكم المشروع، ولن يُحتسب ضمن التقييمات المطلوبة له، وتُحذف مسودته إن وُجدت.</p>',ok:'اعتماد الاستبعاد',fn:async()=>{await api.resolveCOI(d.id,'approved');toast('اعتُمد الاستبعاد.')}}),
  coino:d=>run(()=>api.resolveCOI(d.id,'rejected'),'رُفض طلب الاستبعاد.'),
  reopen:d=>reasonModal('إعادة فتح تقييم','سبب إعادة الفتح (يُوثّق)',async r=>{await api.reopenEval(d.id,r);toast('أُعيد فتح التقييم.')}),
  openeval:d=>{UI.drawer={type:'eval',id:d.id};render()},evaldraft:()=>SUBMIT.evaldraft(),evalsubmit:()=>SUBMIT.evalsubmit(),coiselfsubmit:()=>SUBMIT.coiselfsubmit(),
  calc:()=>run(()=>api.calcResults(UI.hid),'احتُسبت النتائج. راجعها قبل الاعتماد.'),
  approve:()=>confirmBox({title:'اعتماد النتائج؟',body:'<p>يُثبّت الترتيب الحالي. أي تغيير لاحق في التقييمات يسحب الاعتماد تلقائيًا.</p>',ok:'اعتماد',fn:async()=>{await api.approveResults(UI.hid);toast('اعتُمدت النتائج.')}}),
  publish:()=>confirmBox({title:'نشر النتائج؟',body:'<p>تُنشر: المسار، المركز، اسم الفريق، عنوان المشروع فقط.</p>',ok:'نشر',fn:async()=>{await api.publishResults(UI.hid);toast('نُشرت النتائج داخل المنصة.')}}),
  unpublish:()=>run(()=>api.unpublishResults(UI.hid),'أُوقف النشر.'),
  adj:d=>confirmBox({title:`تعديل ترتيب: ${PR(d.id).title}`,reason:'سبب التعديل الإداري (يُوثّق)',ok:'حفظ التعديل',extra:`<label class="field"><span>المركز الجديد</span><input id="adjRank" type="number" min="1" value="1"></label>`,
    fn:async()=>{await api.adjustRank(UI.hid,d.id,document.getElementById('adjRank').value,document.getElementById('mReason').value);toast('سُجّل التعديل. أعد الاعتماد.')}}),
  uedit:d=>{UI.drawer={type:'user',id:d.id,role:d.role};render()},usersubmit:()=>SUBMIT.usersubmit(),
  uactive:d=>run(async()=>{await api.setActive(d.id,!!d.on);UI.drawer=null},'حُدّث الحساب.'),
  refresh:()=>run(()=>call('load'),'حُدّثت البيانات.'),
  logout:()=>{setToken(null);DB=null;UI.user=null;UI.hid=null;UI.page='dash';UI.drawer=null;UI.modal=null;render()},
  mypw:()=>confirmBox({title:'تغيير كلمة المرور',body:'<p class="muted">10 أحرف على الأقل.</p>',extra:'<label class="field"><span>كلمة المرور الجديدة</span><input id="newPw" type="password" autocomplete="new-password"></label>',ok:'حفظ',
    fn:async()=>{await api.setPassword(UI.user,document.getElementById('newPw').value);toast('تم تغيير كلمة المرور.')}}),
  authview:d=>{UI.authView=d.k;render()}
};
if(typeof document!=='undefined'){
  document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;if(el.tagName==='SUMMARY')return;const fn=ACT[el.dataset.a];if(!fn)return;e.preventDefault();
    if(el.closest('details.pop'))el.closest('details.pop').open=false;fn(el.dataset,el,e)});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(UI.modal){UI.modal=null;render()}else if(UI.drawer){UI.drawer=null;render()}}
    if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr.click')){e.preventDefault();e.target.click()}});
  document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;if(f.dataset.form==='gsearch'){UI.q=new FormData(f).get('q')||'';go('search');return}
    if(f.dataset.form==='login'||f.dataset.form==='setup'){const fd=new FormData(f);const err=document.getElementById('authErr');err.textContent='';
      try{if(f.dataset.form==='setup'){await call('setup',[fd.get('key'),fd.get('name'),fd.get('email'),fd.get('password')]);toast('تم إنشاء الحساب. سجّل الدخول الآن.');UI.authView='login';render();return}
        const r=await call('login',[fd.get('email'),fd.get('password')]);setToken(r.token);UI.page='dash';await loadData()}catch(x){const el=document.getElementById('authErr');if(el)el.textContent=x.message;else toast(x.message,true)}return}
    const map={hsave:'hsubmit',appsave:'appsubmit',note:'notesubmit',newapp:'newappsubmit',teamsave:'teamsubmit',projsave:'projsubmit',follow:'followsubmit',tracksave:'tracksubmit',csave:'csubmit',sessave:'sessubmit',coiself:'coiselfsubmit',usersave:'usersubmit',evalsave:'evaldraft'};
    const k=map[f.dataset.form];if(k&&SUBMIT[k])SUBMIT[k]()});
  document.addEventListener('input',e=>{const el=e.target;const k=el.dataset.in;if(k==='tq'){const st=UI.tables[el.dataset.t];st.q=el.value;st.page=1;UI.focus=el.id;render()}if(k==='csum')updCSum();if(k==='trsum')updTrSum()});
  document.addEventListener('change',e=>{const el=e.target;const k=el.dataset.ch;if(!k)return;const st=UI.tables[el.dataset.t];
    if(k==='hk'){UI.hid=el.value;UI.drawer=null;if(['dash','hackathons','users','audit','about','hnew'].includes(UI.page))UI.page='overview';render();toast('الهاكاثون النشط: '+H(el.value).nameAr)}
    else if(k==='tf'){st.f[el.dataset.k]=el.value;st.page=1;render()}else if(k==='tsize'){st.size=+el.value;st.page=1;render()}
    else if(k==='tcol'){st.hidden=el.checked?st.hidden.filter(x=>x!==el.dataset.k):[...st.hidden,el.dataset.k];render()}
    else if(k==='tsel'){const s=UI.sel[el.dataset.t];el.checked?s.add(el.dataset.id):s.delete(el.dataset.id);render()}
    else if(k==='tall'){const s=UI.sel[el.dataset.t];document.querySelectorAll(`[data-ch=tsel][data-t="${el.dataset.t}"]`).forEach(c=>el.checked?s.add(c.dataset.id):s.delete(c.dataset.id));render()}
    else if(k==='quickassign'){if(el.value)run(()=>api.assign(el.dataset.id,el.value),'تم الإسناد.')}
    else if(k==='jt')run(()=>api.setJudgeTrack(UI.hid,el.dataset.j,el.dataset.t,el.checked),el.checked?'أُسند المحكم.':'أُلغي الإسناد.')
    else if(k==='teamtrack'){const sel=document.getElementById('te-ch');sel.innerHTML='<option value="">—</option>'+DB.challenges.filter(c=>c.trackId===el.value).map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('')}
    else if(k==='trown'){document.getElementById('trW').hidden=!el.checked;updTrSum()}
    else if(k==='csum')updCSum()
    else if(k==='logo'){const f=el.files[0];if(!f)return;if(f.size>300*1024){toast('حجم الشعار أكبر من 300 كيلوبايت.',true);el.value='';return}const r=new FileReader();r.onload=()=>{document.getElementById('f-logoData').value=r.result;document.getElementById('logoPrev').innerHTML=`<img src="${r.result}" alt="الشعار" style="max-height:48px">`};r.readAsDataURL(f)}});
  UI.token=getToken();render();
  if(UI.token)loadData().catch(e=>{render();toast(e.message,true)});
}
